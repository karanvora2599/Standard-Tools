[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "standard_quant_tools"
authors = [{name = "Antigravity", email = "antigravity@example.com"}]
dynamic = ["version", "description"]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "pydantic>=2.0.0",
    "plotly>=5.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0"  # For regression tools
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
dev = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]
