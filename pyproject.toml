[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "standard_quant_tools"
authors = [{name = "Karan Vora", email = "kv2154@nyu.edu"}]
maintainers = [{name = "Karan Vora", email = "kv2154@nyu.edu"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version", "description"]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "pydantic>=2.0.0",
    "plotly>=5.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "numba>=0.57.0",
    "aiohttp>=3.8.0",
    "cachetools>=5.3.0",
    "pyarrow>=12.0.0"
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/karanvora2599/Standard-Tools"
Repository = "https://github.com/karanvora2599/Standard-Tools"
Issues = "https://github.com/karanvora2599/Standard-Tools/issues"
Changelog = "https://github.com/karanvora2599/Standard-Tools/blob/main/CHANGELOG.md"

[project.scripts]
sqt = "standard_quant_tools.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "integration: tests requiring live network access (skip with '-m not integration')",
    "slow: tests that are slow due to Numba JIT warm-up or large data",
    "benchmark: wall-clock perf tests comparing C++ vs Python paths (requires _sqt_core; run with '-m benchmark -s')",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "anthropic>=0.34.0"
]
dev = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
