[build-system]
# scikit-build-core, not flit_core: flit is a pure-Python backend, so
# `pip install .` produced a package WITHOUT _sqt_core no matter what the
# machine could compile. Building the extension was a separate manual CMake
# step, which meant "installed Standard Tools" could mean two materially
# different runtimes -- and nothing in the install output said which one you
# had. The extension is now built as part of a normal install when a C++
# toolchain is present, and skipped gracefully when it is not (see
# CMakeLists.txt); pass -C cmake.define.SQT_REQUIRE_NATIVE=ON to make a
# missing toolchain a hard error instead.
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "standard_quant_tools"
authors = [{name = "Karan Vora", email = "kv2154@nyu.edu"}]
maintainers = [{name = "Karan Vora", email = "kv2154@nyu.edu"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
version = "0.1.0"
description = "Standard quantitative finance tools for backtesting, analysis, and agent-based trading."
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "pydantic>=2.0.0",
    "plotly>=5.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.2.0",
    "numba>=0.57.0",
    "aiohttp>=3.8.0",
    "cachetools>=5.3.0",
    "pyarrow>=12.0.0",
    "python-dotenv>=1.0.0"
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/karanvora2599/Standard-Tools"
Repository = "https://github.com/karanvora2599/Standard-Tools"
Issues = "https://github.com/karanvora2599/Standard-Tools/issues"
Changelog = "https://github.com/karanvora2599/Standard-Tools/blob/main/CHANGELOG.md"

[project.scripts]
sqt = "standard_quant_tools.cli:main"
# The MCP server. Needs the [mcp] extra; without it the entry point
# exists but fails on import with a clear ImportError rather than
# making `mcp` a dependency of every install.
sqt-mcp = "standard_quant_tools.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# --strict-markers: a typo in a @pytest.mark name is currently a silent
# no-op, so a test meant to be gated runs ungated (or a whole marker
# selection quietly matches nothing). With this, an unregistered marker
# is an error at collection.
addopts = "-v --tb=short --strict-markers"
markers = [
    "integration: tests requiring live network access (skip with '-m not integration')",
    "slow: tests that are slow due to Numba JIT warm-up or large data",
    "benchmark: wall-clock perf tests comparing C++ vs Python paths (requires _sqt_core; run with '-m benchmark -s')",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "anthropic>=0.34.0",
    # tests/mcp/ is schema- and wiring-level, no network, but it does
    # need the SDK to build the server objects it inspects.
    "mcp>=2.0.0"
]
dev = [
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]
bloomberg = [
    "blpapi>=3.24.0"
]
signing = [
    "cryptography>=42.0.0"
]
polars = [
    "polars>=0.20.0"
]

mcp = [
    "mcp>=2.0.0"
]

# The HTTP transport. Split from [mcp] because a client that launches the
# server over stdio has no use for a web server, and this is the extra that
# makes `--transport http` runnable. Both are already transitive
# dependencies of the SDK today; pinning them here is what keeps the
# transport working if that stops being true.
mcp-http = [
    "mcp>=2.0.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0"
]

[tool.scikit-build]
# The package lives under src/; without this the backend would look for a
# top-level standard_quant_tools/ directory and build an empty wheel.
wheel.packages = ["src/standard_quant_tools"]
cmake.version = ">=3.19"
# Release, not the CMake default: a debug build of this extension is several
# times slower, which would silently undo the entire reason it exists.
cmake.build-type = "Release"
# The compiled artifact is the only thing CMake needs to contribute to the
# wheel; everything else is the pure-Python tree copied by wheel.packages.
build.verbose = false
sdist.exclude = ["build/", "build_*/", "*.pyd", "*.so"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88
