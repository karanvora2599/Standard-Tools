name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: black + isort
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linters
        # Pinned: an unpinned formatter fails CI on unchanged code the day a
        # release changes its style. Bump both deliberately, and reformat.
        run: pip install black==26.5.1 isort==9.0.2

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Check import ordering (isort)
        run: isort --check --diff src/ tests/
