<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="How a call runs: serve, dispatch, compute, hand off, record. From Python one tool at a time; over MCP one runtime per session." font-family="Plex" font-size="14"><title>How a call runs: serve, dispatch, compute, hand off, record. From Python one tool at a time; over MCP one runtime per session.</title><style>@font-face{font-family:"Plex";font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"PlexMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x="0.0" y="0.0" width="1200.0" height="372.0" rx="0" fill="#131313"/>
<rect x="20.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#131313" stroke="#444444" stroke-width="1"/>
<rect x="20.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#5ac5fa"/>
<text x="34.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#efefed">01  SERVE</text>
<text x="34.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">one runtime per client</text>
<text x="34.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">MCP or function calling</text>
<text x="34.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">thinned schemas under auto</text>
<text x="34.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">describe_tool on demand</text>
<path d="M238.0 130.0L247.0 138.0L238.0 146.0" fill="none" stroke="#a4a4a4" stroke-width="2"/>
<rect x="258.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#131313" stroke="#444444" stroke-width="1"/>
<rect x="258.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#75fbe1"/>
<text x="272.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#efefed">02  DISPATCH</text>
<text x="272.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">Pydantic-validated input</text>
<text x="272.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">unknown arguments refused</text>
<text x="272.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">foreign tools unroutable</text>
<text x="272.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">errors that name the fix</text>
<path d="M476.0 130.0L485.0 138.0L476.0 146.0" fill="none" stroke="#a4a4a4" stroke-width="2"/>
<rect x="496.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#131313" stroke="#444444" stroke-width="1"/>
<rect x="496.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#75fb6d"/>
<text x="510.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#efefed">03  COMPUTE</text>
<text x="510.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">C++ kernels when built</text>
<text x="510.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">Python fallback, same API</text>
<text x="510.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">point-in-time contracts</text>
<text x="510.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">a stated risk-free rate</text>
<path d="M714.0 130.0L723.0 138.0L714.0 146.0" fill="none" stroke="#a4a4a4" stroke-width="2"/>
<rect x="734.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#131313" stroke="#444444" stroke-width="1"/>
<rect x="734.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#dc2f21"/>
<text x="748.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#efefed">04  HAND OFF</text>
<text x="748.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">bulk values as sqt:// refs</text>
<text x="748.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">never through the chat</text>
<text x="748.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">kind checked on resolve</text>
<text x="748.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">read in any runtime</text>
<path d="M952.0 130.0L961.0 138.0L952.0 146.0" fill="none" stroke="#a4a4a4" stroke-width="2"/>
<rect x="972.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#131313" stroke="#444444" stroke-width="1"/>
<rect x="972.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#f5be41"/>
<text x="986.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#efefed">05  RECORD</text>
<text x="986.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">a decision record per call</text>
<text x="986.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">content hashes of the data</text>
<text x="986.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">hash-chained across days</text>
<text x="986.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#efefed">sqt replay and verify</text>
<rect x="20.0" y="276.0" width="565.0" height="76.0" rx="0" fill="#1a1a1a"/>
<text x="36.0" y="306.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#f25144">PYTHON</text>
<text x="36.0" y="332.0" font-family="Plex" font-weight="400" font-size="15" fill="#efefed">import a tool: one Pydantic model in, one Pydantic model out</text>
<rect x="615.0" y="276.0" width="565.0" height="76.0" rx="0" fill="#1a1a1a"/>
<text x="631.0" y="306.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#f25144">MCP</text>
<text x="631.0" y="332.0" font-family="Plex" font-weight="400" font-size="15" fill="#efefed">sqt-mcp --runtime research serves one runtime to any client</text>
