<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="How a call runs: serve, dispatch, compute, hand off, record. From Python one tool at a time; over MCP one runtime per session." font-family="Plex" font-size="14"><title>How a call runs: serve, dispatch, compute, hand off, record. From Python one tool at a time; over MCP one runtime per session.</title><style>@font-face{font-family:"Plex";font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"PlexMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x="0.0" y="0.0" width="1200.0" height="372.0" rx="0" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#ffffff" stroke="#d8d5ce" stroke-width="1"/>
<rect x="20.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#5bbff4"/>
<text x="34.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#1a1a1a">01  SERVE</text>
<text x="34.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">one runtime per client</text>
<text x="34.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">MCP or function calling</text>
<text x="34.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">thinned schemas under auto</text>
<text x="34.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">describe_tool on demand</text>
<path d="M238.0 130.0L247.0 138.0L238.0 146.0" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="258.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#ffffff" stroke="#d8d5ce" stroke-width="1"/>
<rect x="258.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#74f2d6"/>
<text x="272.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#1a1a1a">02  DISPATCH</text>
<text x="272.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">Pydantic-validated input</text>
<text x="272.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">unknown arguments refused</text>
<text x="272.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">foreign tools unroutable</text>
<text x="272.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">errors that name the fix</text>
<path d="M476.0 130.0L485.0 138.0L476.0 146.0" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="496.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#ffffff" stroke="#d8d5ce" stroke-width="1"/>
<rect x="496.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#79ee5f"/>
<text x="510.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#1a1a1a">03  COMPUTE</text>
<text x="510.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">C++ kernels when built</text>
<text x="510.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">Python fallback, same API</text>
<text x="510.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">point-in-time contracts</text>
<text x="510.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">a stated risk-free rate</text>
<path d="M714.0 130.0L723.0 138.0L714.0 146.0" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="734.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#ffffff" stroke="#d8d5ce" stroke-width="1"/>
<rect x="734.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#d6352a"/>
<text x="748.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#1a1a1a">04  HAND OFF</text>
<text x="748.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">bulk values as sqt:// refs</text>
<text x="748.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">never through the chat</text>
<text x="748.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">kind checked on resolve</text>
<text x="748.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">read in any runtime</text>
<path d="M952.0 130.0L961.0 138.0L952.0 146.0" fill="none" stroke="#555555" stroke-width="2"/>
<rect x="972.0" y="20.0" width="208.0" height="236.0" rx="0" fill="#ffffff" stroke="#d8d5ce" stroke-width="1"/>
<rect x="972.0" y="20.0" width="208.0" height="6.0" rx="0" fill="#f2b43c"/>
<text x="986.0" y="54.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#1a1a1a">05  RECORD</text>
<text x="986.0" y="92.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">a decision record per call</text>
<text x="986.0" y="132.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">content hashes of the data</text>
<text x="986.0" y="172.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">hash-chained across days</text>
<text x="986.0" y="212.0" font-family="Plex" font-weight="400" font-size="14" fill="#1a1a1a">sqt replay and verify</text>
<rect x="20.0" y="276.0" width="565.0" height="76.0" rx="0" fill="#efefed"/>
<text x="36.0" y="306.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#b3261e">PYTHON</text>
<text x="36.0" y="332.0" font-family="Plex" font-weight="400" font-size="15" fill="#1a1a1a">import a tool: one Pydantic model in, one Pydantic model out</text>
<rect x="615.0" y="276.0" width="565.0" height="76.0" rx="0" fill="#efefed"/>
<text x="631.0" y="306.0" font-family="PlexMono" font-weight="600" font-size="13" letter-spacing="1.56" fill="#b3261e">MCP</text>
<text x="631.0" y="332.0" font-family="Plex" font-weight="400" font-size="15" fill="#1a1a1a">sqt-mcp --runtime research serves one runtime to any client</text>
