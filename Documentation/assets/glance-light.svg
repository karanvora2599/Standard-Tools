<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="At a glance: 274× for rolling Hurst with the C++ extension; 1.7 min to test all 1,999,000 pairs of 2,000 names for cointegration at 500 bars; ~58× for the backtest kernel; 12 runtimes; 9 test layers; 21 of 21 planted mutations killed" font-family="Plex" font-size="14"><title>At a glance: 274× for rolling Hurst with the C++ extension; 1.7 min to test all 1,999,000 pairs of 2,000 names for cointegration at 500 bars; ~58× for the backtest kernel; 12 runtimes; 9 test layers; 21 of 21 planted mutations killed</title><style>@font-face{font-family:"Plex";font-weight:400;src:url(data:font/woff2;base64,) format("woff2");}@font-face{font-family:"PlexMono";font-weight:500;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x="0.0" y="0.0" width="376.0" height="5.0" rx="0" fill="#5bbff4"/>
<text x="0.0" y="56.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">274×</text>
<text x="0.0" y="92.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">rolling Hurst with the C++ extension, against the</text>
<text x="0.0" y="115.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">same module's Python path</text>
<rect x="412.0" y="0.0" width="376.0" height="5.0" rx="0" fill="#79ee5f"/>
<text x="412.0" y="56.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">1.7 min</text>
<text x="412.0" y="92.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">to test 2,000 names for cointegration at 500 bars:</text>
<text x="412.0" y="115.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">both orders of all 1,999,000 pairs</text>
<rect x="824.0" y="0.0" width="376.0" height="5.0" rx="0" fill="#d6352a"/>
<text x="824.0" y="56.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">~58×</text>
<text x="824.0" y="92.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">the backtest kernel, timed by toggling HAS_CPP on</text>
<text x="824.0" y="115.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">the same call</text>
<rect x="0.0" y="195.0" width="376.0" height="5.0" rx="0" fill="#74f2d6"/>
<text x="0.0" y="251.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">12</text>
<text x="0.0" y="287.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">runtimes, each refusing every tool it does not own</text>
<rect x="412.0" y="195.0" width="376.0" height="5.0" rx="0" fill="#f2b43c"/>
<text x="412.0" y="251.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">9</text>
<text x="412.0" y="287.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">test layers, each catching a class of defect the</text>
<text x="412.0" y="310.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">others cannot</text>
<rect x="824.0" y="195.0" width="376.0" height="5.0" rx="0" fill="#1a1a1a"/>
<text x="824.0" y="251.0" font-family="PlexMono" font-weight="500" font-size="42" letter-spacing="-0.84" fill="#1a1a1a">21 of 21</text>
<text x="824.0" y="287.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">planted mutations killed: the suite notices a bug,</text>
<text x="824.0" y="310.0" font-family="Plex" font-weight="400" font-size="16" fill="#3d3d3d">not only runs green</text>
</svg>
